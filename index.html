<!DOCTYPE html>
<html lang="ar" dir="rtl" data-frame-refused-watch=""><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة تعزيز الموجهة الطلابية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg1:#bfe9ff;--bg2:#fff1f7;--card:#fff;--tx:#33284a;--mu:#7a6f93;--bd:#eadff7;--hi:#fff4c2;--ac:#7c4dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg1:#1b2447;--bg2:#2a1d40;--card:#2b2548;--tx:#f4efff;--mu:#b9afd6;--bd:#40386a;--hi:#4a4120;--ac:#a98bff}}
:root[data-theme="dark"]{color-scheme:dark;--bg1:#1b2447;--bg2:#2a1d40;--card:#2b2548;--tx:#f4efff;--mu:#b9afd6;--bd:#40386a;--hi:#4a4120;--ac:#a98bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--tx);font-family:Cairo,Tajawal,system-ui,sans-serif;font-weight:500;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:14px 14px 70px}
.hd{text-align:center;position:relative;padding-top:4px}
.logo{width:230px;max-width:80%;height:auto;border-radius:22px;padding:6px;background:#fff;border:4px solid #fff;box-shadow:0 4px 14px #7c4dff44;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;box-sizing:border-box}
.logo img{width:100%;height:auto;display:block;border-radius:16px}
.hd h1{margin:0;font-size:1.7rem;font-weight:800;color:#7c4dff;line-height:1.7}
.hd p{margin:0;color:var(--mu)}
.rb{display:block;margin:6px auto 0;width:200px;max-width:60%}
.sky{position:absolute;inset:0;pointer-events:none;z-index:0}
.hd>*:not(.sky){position:relative;z-index:1}
h2{font-size:1.5rem;font-weight:800;margin:6px 0}
.in{width:100%;box-sizing:border-box;padding:12px 16px;border:3px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;margin:10px 0}
textarea.in{min-height:260px;border-radius:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.card{display:block;border-radius:24px;padding:14px 10px;color:#fff;text-decoration:none;text-align:center;box-shadow:0 5px 0 #0002;background:var(--c)}
.card .ic{font-size:44px;line-height:1.1}.card b{display:block;font-size:1.35rem;font-weight:800}.card span{font-size:.85rem;opacity:.95}
.k0{--c:#ff7eb6}.k1{--c:#ffa53d}.k2{--c:#32c48d}.k3{--c:#3aa0ff}.k4{--c:#9b6bff}.k5{--c:#ff6b6b}.k6{--c:#17b8c9}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:8px 12px;margin-bottom:10px;color:var(--tx);text-decoration:none;flex-wrap:wrap}
.row.top{background:var(--hi);border-color:#ffd54f}
.av{font-size:30px;width:44px;height:44px;border-radius:50%;background:var(--hi);display:flex;align-items:center;justify-content:center;flex:none}
.nm{flex:1;min-width:110px;font-size:1.1rem;font-weight:700}
.pill{display:flex;align-items:center;gap:4px;border-radius:16px;padding:2px 10px;font-weight:800;font-size:1.1rem}
.pe{background:#fff3c4;color:#8a5a00}.pa{background:#d9f1ff;color:#075a8c}
.ctl{display:flex;flex-direction:column;gap:3px;align-items:center}
.ctl button{width:34px;height:28px;padding:0;font-size:1.1rem;border-radius:10px;border:0;color:#fff;font-family:inherit}
.be{background:#f5a623}.ba{background:#29a3e8}.cw{display:flex;gap:4px}
.lg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.lg .pill{font-size:1rem;padding:4px 12px}
.mu{color:var(--mu)}
button{font:inherit;font-weight:700;border:0;background:var(--card);color:var(--tx);border-radius:16px;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 #0002}
button.p{background:var(--ac);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ban{background:var(--hi);border-radius:16px;padding:8px 12px;margin:8px 0;font-size:.9rem;text-align:center}
a.back{display:inline-block;background:var(--card);border-radius:16px;padding:4px 14px;color:var(--ac);text-decoration:none;font-weight:700;box-shadow:0 3px 0 #0002;margin-top:8px}
.st{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;background:var(--card);border-radius:12px;padding:4px 12px;font-size:.85rem;display:none;box-shadow:0 2px 8px #0003}
</style>
</head>

 return `<div class="hd"><svg class="sky" viewBox="0 0 400 150" preserveAspectRatio="none" aria-hidden="true"><g fill="#fff" opacity=".9"><circle cx="40" cy="40" r="14"/><circle cx="58" cy="36" r="18"/><circle cx="78" cy="42" r="13"/><circle cx="330" cy="30" r="12"/><circle cx="348" cy="26" r="16"/><circle cx="368" cy="32" r="11"/></g><circle cx="375" cy="85" r="16" fill="#ffd54f"/><path d="M20 100l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" fill="#ffc107"/><path d="M372 125l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1z" fill="#29b6f6"/></svg>
 <div class="logo">${LOGO?`<img src="${LOGO}" alt="شعار المدرسة">`:'🏫'}</div>
 <h1>لوحة تعزيز الموجهة الطلابية</h1><p>${esc(S.school)}</p>
 <svg class="rb" viewBox="0 0 200 60" aria-hidden="true"><g fill="none" stroke-width="7" stroke-linecap="round"><path d="M10 55a90 50 0 0 1 180 0" stroke="#ff6b6b"/><path d="M20 55a80 42 0 0 1 160 0" stroke="#ffb703"/><path d="M30 55a70 34 0 0 1 140 0" stroke="#5ad17a"/><path d="M40 55a60 26 0 0 1 120 0" stroke="#3aa0ff"/></g></svg></div>`;
}
function ban(){return owner?`<div class="ban">وضع الموجهة: أضيفي النجوم وعدّلي القوائم، وتُحفظ التغييرات تلقائيًا ✨ <button data-act="logout" style="padding:2px 10px;box-shadow:none">خروج</button></div>`:''}
function render(){
 if(login)return loginView();
 if(edit)return form();
 const m=/^c(\d+)$/.exec(location.hash.slice(1)),c=m&&cls(m[1]);
 c?classView(c):home();
}
function loginView(){
 $.innerHTML=header()+`<h2>دخول الموجهة</h2><input id="em" class="in" type="email" placeholder="البريد الإلكتروني" autocomplete="username" dir="ltr"><input id="pw" class="in" type="password" placeholder="كلمة السر" autocomplete="current-password" dir="ltr"><p id="er" class="mu"></p><div class="bar"><button class="p" data-act="dologin">دخول</button><button data-act="cancel">إلغاء</button></div>`;
}
function home(){
 let h=header()+ban()+'<input id="q" class="in" placeholder="🔍 ابحث عن اسمك…" autocomplete="off"><div id="res"></div><div class="grid">';
 S.classes.forEach((c,i)=>{h+=`<a class="card k${i%7}" href="#c${c.id}"><div class="ic">${c.icon}</div><b>${esc(c.name)}</b><span>${c.students.length} طالب</span></a>`});
 h+='</div>';
 if(owner)h+='<div class="bar"><button data-act="new">＋ إضافة فصل</button></div>';
 else h+='<div class="bar" style="justify-content:center;margin-top:24px"><button data-act="login" style="font-size:.8rem;opacity:.7">🔒 دخول الموجهة</button></div>';
 $.innerHTML=h;
}
function classView(c){
 let h=header()+`<a class="back" href="#">← كل الفصول</a><h2>${c.icon} ${esc(c.name)}</h2>`;
 h+=`<div class="lg"><span class="pill pe">${SE} نجوم التميز: ${sum(c,'e')}</span><span class="pill pa">${SA} نجوم الحضور: ${sum(c,'a')}</span></div>`+ban();
 h+=`<div class="bar"><button data-act="sort">${byStars?'ترتيب القائمة':'ترتيب حسب النجوم'}</button>${owner?`<button data-act="edit" data-c="${c.id}">تعديل الأسماء</button>`:''}</div>`;
 let list=c.students.map((s,i)=>({...s,i,t:s.e+s.a}));
 if(byStars)list.sort((a,b)=>b.t-a.t);
 const max=Math.max(...list.map(s=>s.t),0);
 list.forEach(s=>{
  const ctl=(k,cl)=>owner?`<span class="cw"><button class="${cl}" data-act="add" data-k="${k}" data-c="${c.id}" data-i="${s.i}">+</button><button class="${cl}" data-act="sub" data-k="${k}" data-c="${c.id}" data-i="${s.i}">−</button></span>`:'';
  h+=`<div class="row${max>0&&s.t===max?' top':''}"><span class="av">${AV[s.i%AV.length]}</span><span class="nm">${esc(s.n)}${max>0&&s.t===max?' 👑':''}</span><span><span class="pill pe">${SE} ${s.e}</span>${ctl('e','be')}</span><span><span class="pill pa">${SA} ${s.a}</span>${ctl('a','ba')}</span></div>`;
 });
 if(!list.length)h+='<p class="mu">لا توجد أسماء بعد.</p>';
 $.innerHTML=h;
}
function form(){
 const c=edit.id==null?{name:'',students:[]}:cls(edit.id);
 $.innerHTML=header()+`<h2>${edit.id==null?'فصل جديد':'تعديل الفصل'}</h2><p class="mu">اسم الفصل، ثم أسماء الطلاب (اسم في كل سطر). النجوم تبقى لمن لم يتغير اسمه.</p><input id="fn" class="in" placeholder="اسم الفصل" value="${esc(c.name)}"><textarea id="fs" class="in">${esc(c.students.map(s=>s.n).join('\n'))}</textarea><div class="bar"><button class="p" data-act="save">حفظ</button><button data-act="cancel">إلغاء</button>${edit.id!=null?`<button data-act="del" data-c="${c.id}">حذف الفصل</button>`:''}</div>`;
}
$.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,c=cls(b.dataset.c);
 if(a==='add'||a==='sub'){if(!owner)return;const s=c.students[+b.dataset.i],k=b.dataset.k;s[k]=Math.max(0,s[k]+(a==='add'?1:-1));render();commit()}
 else if(a==='sort'){byStars=!byStars;render()}
 else if(a==='new'){edit={id:null};render()}
 else if(a==='edit'){edit={id:c.id};render()}
 else if(a==='cancel'){edit=null;login=false;render()}
 else if(a==='login'){login=true;render()}
 else if(a==='logout'){auth&&auth.signOut()}
 else if(a==='dologin'){
  const em=$.querySelector('#em').value.trim(),pw=$.querySelector('#pw').value;
  $.querySelector('#er').textContent='جارٍ الدخول…';
  auth.signInWithEmailAndPassword(em,pw).catch(()=>{const er=$.querySelector('#er');if(er)er.textContent='البريد أو كلمة السر غير صحيحة'});
 }
 else if(a==='del'){
  if(b.dataset.sure){S.classes=S.classes.filter(x=>x!==c);edit=null;location.hash='';render();commit()}
  else{b.dataset.sure=1;b.textContent='اضغطي مرة أخرى للتأكيد'}
 }
 else if(a==='save'){
  const name=$.querySelector('#fn').value.trim()||'فصل',
   names=$.querySelector('#fs').value.split('\n').map(x=>x.trim()).filter(Boolean);
  let t=edit.id==null?null:cls(edit.id);
  const old=new Map(t?t.students.map(s=>[s.n,s]):[]);
  const students=names.map(n=>({n,e:old.has(n)?old.get(n).e:0,a:old.has(n)?old.get(n).a:0}));
  if(t){t.name=name;t.students=students}
  else{t={id:Math.max(0,...S.classes.map(x=>x.id))+1,name,icon:'⭐',students};S.classes.push(t)}
  edit=null;render();commit();
 }
});
document.addEventListener('input',e=>{
 if(e.target.id!=='q')return;
 const q=e.target.value.trim(),r=document.getElementById('res');
 if(!q){r.innerHTML='';return}
 let h='';
 S.classes.forEach(c=>c.students.forEach(s=>{if(s.n.includes(q))h+=`<a class="row" href="#c${c.id}"><span class="av">${c.icon}</span><span class="nm">${esc(s.n)}<br><span class="mu" style="font-size:.85rem">${esc(c.name)}</span></span><span class="pill pe">${SE} ${s.e}</span><span class="pill pa">${SA} ${s.a}</span></a>`}));
 r.innerHTML=h||'<p class="mu">لا توجد نتائج.</p>';
});
window.addEventListener('hashchange',()=>{edit=null;login=false;render()});
function commit(){say('جارٍ الحفظ…');clearTimeout(timer);timer=setTimeout(save,800)}
function save(){
 if(!ref||!owner){say('تعذّر الحفظ');return}
 ref.set({data:JSON.stringify({school:S.school,classes:S.classes}),t:Date.now()})
  .then(()=>say('تم الحفظ ✓',1800))
  .catch(()=>say('تعذّر الحفظ، تأكدي من تسجيل الدخول'));
}
try{
 firebase.initializeApp(cfg);
 auth=firebase.auth();
 ref=firebase.firestore().collection('board').doc('main');
 ref.onSnapshot(snap=>{
  if(snap.metadata.hasPendingWrites)return;
  if(snap.exists){
   try{const d=JSON.parse(snap.data().data);if(d.classes){S.classes=d.classes;if(d.school)S.school=d.school}}catch(e){}
   const f=document.activeElement;
   if(!edit&&!login&&!(f&&f.id==='q'))render();
  }
 },()=>say('تعذّر الاتصال بقاعدة البيانات',3000));
 auth.onAuthStateChanged(u=>{owner=!!u;login=false;edit=null;render()});
}catch(e){say('تعذّر الاتصال',3000)}
render();
</script>
</body>
</html>
